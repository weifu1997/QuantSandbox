# QuantSandbox 示例配置
#
# 说明：
# - 这是示例文件，请把真实配置放到你自己的本地环境里
# - 不要把真实 token 提交到 GitHub

account:
  initial_cash: 15000.0
  commission_rate: 0.00025
  tax_rate: 0.0005

stock_pool:
  - sz000719
  - sh600483
  - sz000883
  - sh601598
  - sh600098
  - sh600177

strategy:
  name: bollinger_bands
  parameters:
    window: 20
    std_dev: 2

data_source:
  tushare:
    base_url: https://tushare.data.godscode.com.cn/
    token: YOUR_TUSHARE_TOKEN_HERE
    enabled: false
